# HT-TMIS Production NGINX Reverse Proxy Configuration
# Harari Trade Development Agency, Harari People Regional State

upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name tmis.harari.gov.et;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tmis.harari.gov.et;

    # SSL Certificate & Security Protocols
    ssl_certificate /etc/ssl/certs/ht-tmis.crt;
    ssl_certificate_key /etc/ssl/private/ht-tmis.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Upload size limit
    client_max_body_size 25M;

    # Static assets of React production build
    root /var/www/ht-tmis/dist;
    index index.html;

    # Django collected static files
    location /static_django/ {
        alias /var/www/ht-tmis/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media uploads
    location /media/ {
        alias /var/www/ht-tmis/backend/media/;
        expires 30d;
    }

    # Django REST Framework API routing
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for ReportLab / Excel generation
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Django Admin Portal
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application (React) route fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
